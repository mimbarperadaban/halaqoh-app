<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halaqah Qur'an</title>
<meta name="description" content="Absensi guru dan capaian hafalan Qur'an santri">
<meta name="theme-color" content="#0B3D35">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Halaqah">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="config.js"></script>
<style>
  :root{--hijau:#0B3D35;--hijau2:#14b8a6}
  html,body{margin:0;height:100%;background:#f4f7f6;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
  iframe{position:fixed;top:env(safe-area-inset-top,0);left:0;width:100%;height:calc(100% - env(safe-area-inset-top,0px));border:0;background:#f4f7f6}
  body::before{content:'';position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0);background:var(--hijau)}

  #splash{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#0B3D35;color:#fff;
    transition:opacity .6s ease,transform .6s ease}
  #splash.hilang{opacity:0;transform:scale(1.06);pointer-events:none}
  #splash .isi{text-align:center}
  #splash img{width:110px;height:110px;border-radius:28px;box-shadow:0 18px 40px rgba(0,0,0,.25);animation:denyut 1.8s ease-in-out infinite}
  #splash h1{font-size:22px;margin:18px 0 4px;letter-spacing:.3px;animation:naik .7s .1s both}
  #splash p{margin:0;opacity:.85;font-size:14px;animation:naik .7s .25s both}
  .titik{display:flex;gap:7px;justify-content:center;margin-top:22px}
  .titik i{width:9px;height:9px;border-radius:50%;background:#fff;animation:loncat 1s ease-in-out infinite}
  .titik i:nth-child(2){animation-delay:.15s}.titik i:nth-child(3){animation-delay:.3s}
  #pesan{display:none;max-width:420px;padding:0 24px;margin-top:18px;font-size:14px;line-height:1.5;animation:naik .4s both}
  #pesan b{display:block;font-size:17px;margin-bottom:6px}
  #pesan button{margin-top:14px;background:#fff;color:#0f766e;border:0;border-radius:12px;padding:11px 20px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit}
  @keyframes denyut{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  @keyframes loncat{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-9px);opacity:1}}
  @keyframes naik{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  .bar{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:9;background:#fff;border-radius:16px;
    box-shadow:0 12px 40px rgba(15,23,42,.22);padding:14px;display:flex;gap:12px;align-items:center;transform:translateY(160%);transition:transform .5s cubic-bezier(.34,1.56,.64,1);
    max-width:520px;margin:0 auto}
  .bar.tampil{transform:none}
  .bar img{width:42px;height:42px;border-radius:12px}
  .bar .teks{flex:1;font-size:14px;color:#1f2933}
  .bar .teks b{display:block;margin-bottom:2px}
  .bar button{border:0;border-radius:10px;padding:9px 14px;font-size:14px;font-family:inherit;cursor:pointer}
  .bar .ya{background:var(--hijau);color:#fff}
  .bar .tidak{background:transparent;color:#6b7280;padding:9px 6px}
  .bar .langkah{font-size:13px;color:#4b5563;margin-top:4px;line-height:1.5}
  .ikon-share{display:inline-block;width:15px;height:15px;vertical-align:-2px}

  #offline{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translate(-50%,-200%);z-index:11;background:#1f2933;color:#fff;
    padding:9px 16px;border-radius:99px;font-size:13px;transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
  #offline.tampil{transform:translate(-50%,0)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="splash"><div class="isi">
  <img src="icons/icon-192.png" alt="">
  <h1>Halaqah Qur'an</h1>
  <p>Absensi guru &amp; capaian hafalan santri</p>
  <div class="titik"><i></i><i></i><i></i></div>
  <div id="pesan"></div>
</div></div>

<iframe id="app" title="Halaqah Qur'an" allow="clipboard-write"></iframe>

<!-- Tombol pasang (Android / Chrome) -->
<div class="bar" id="barPasang">
  <img src="icons/icon-192.png" alt="">
  <div class="teks"><b>Pasang aplikasi</b>Buka lebih cepat dari layar utama HP.</div>
  <button class="tidak" onclick="tutup('barPasang','pasang')">Nanti</button>
  <button class="ya" onclick="pasang()">Pasang</button>
</div>

<!-- Petunjuk iPhone / iPad -->
<div class="bar" id="barIos">
  <img src="icons/icon-192.png" alt="">
  <div class="teks"><b>Pasang di iPhone</b>
    <div class="langkah">Ketuk <svg class="ikon-share" viewBox="0 0 24 24" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
      <b style="display:inline">Bagikan</b> di Safari, lalu pilih <b style="display:inline">Tambah ke Layar Utama</b>.</div></div>
  <button class="tidak" onclick="tutup('barIos','ios')">Tutup</button>
</div>

<!-- Izin notifikasi -->
<div class="bar" id="barNotif">
  <img src="icons/icon-192.png" alt="">
  <div class="teks"><b>Aktifkan notifikasi</b>Terima pengingat absen, setoran, dan pengumuman.</div>
  <button class="tidak" onclick="tutup('barNotif','notif')">Nanti</button>
  <button class="ya" onclick="aktifkanNotif()">Aktifkan</button>
</div>

<div id="offline">Tidak ada koneksi internet</div>

<script>
const C = self.HQ_CONFIG || {};
const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const pushSiap = !!(C.firebaseConfig && C.firebaseConfig.apiKey && C.vapidKey);
let appWin = null, appOrigin = null, pushToken = store.get('hq_push'), promptPasang = null, swReg = null;

/* ---------- Muat app ---------- */
const mulai = Date.now();
function pesan(judul, teks, ulang){
  $('splash').classList.remove('hilang');
  document.querySelector('.titik').style.display = 'none';
  $('pesan').style.display = 'block';
  $('pesan').innerHTML = '<b>' + judul + '</b>' + teks + (ulang ? '<br><button onclick="location.reload()">Coba lagi</button>' : '');
}
let termuat = false;
if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(C.EXEC_URL || '')) {
  pesan('Belum diatur', 'Isi EXEC_URL di file config.js dengan URL web app (berakhiran /exec).');
} else if (!navigator.onLine) {
  pesan('Tidak ada koneksi', 'Aplikasi butuh internet karena datanya langsung dari Google Sheet.', true);
} else {
  $('app').addEventListener('load', () => { termuat = true; setTimeout(() => $('splash').classList.add('hilang'), Math.max(300, 900 - (Date.now() - mulai))); });
  $('app').src = C.EXEC_URL;
  setTimeout(() => { if (!termuat) pesan('Masih memuat…', 'Koneksi lambat. Tunggu sebentar atau coba lagi.', true); }, 20000);
}

/* ---------- Jembatan dengan app Apps Script ---------- */
// Bingkai Google berlapis, jadi pesan umum dikirim ke semua lapisan. Token login hanya ke bingkai app.
const ORIGIN_APP = /^https:\/\/[a-z0-9.-]*script\.googleusercontent\.com$/;
function kirim(m){
  if (appWin) { try { appWin.postMessage(m, appOrigin); } catch(e){} return; }
  (function post(w, d){ try { w.postMessage(m, '*'); } catch(e){} if (d > 3) return;
    try { for (let i = 0; i < w.frames.length; i++) post(w.frames[i], d + 1); } catch(e){} })($('app').contentWindow, 0);
}
let appSiap = false;
window.addEventListener('message', e => {
  if (!ORIGIN_APP.test(e.origin) || !e.data || !e.data.hq) return;
  appWin = e.source; appOrigin = e.origin;
  const d = e.data;
  if (d.hq === 'ready') { appSiap = true; jaga(); e.source.postMessage({ hq: 'token', token: store.get('hq_token'), push: pushToken }, e.origin); }
  if (d.hq === 'save' && d.token) store.set('hq_token', d.token);
  if (d.hq === 'clear') store.del('hq_token');
  if (d.hq === 'act' || d.hq === 'back-ok') { appSiap = true; jaga(); }
  // 'back-home': sudah di halaman utama, Kembali berikutnya = keluar app
});

/* ---------- Tombol Kembali HP ----------
 * Satu entri riwayat "penjaga" dipasang. Saat Kembali ditekan, app di dalam bingkai yang memutuskan:
 * tutup panel notifikasi, kembali ke menu sebelumnya, atau (di menu utama) biarkan app keluar. */
let dijaga = false;
function jaga(){ if (!dijaga && history.pushState) { history.pushState({ hq: 'jaga' }, ''); dijaga = true; } }
window.addEventListener('popstate', () => {
  dijaga = false;
  const bar = document.querySelector('.bar.tampil');
  if (bar) { bar.classList.remove('tampil'); jaga(); return; }
  if (appSiap) kirim({ hq: 'back' });
});

/* ---------- Service worker ---------- */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(r => { swReg = r; siapkanNotif(); });
  navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.hq === 'notif') kirim({ hq: 'notif' }); });
}

/* ---------- Bar bawah ---------- */
function bolehTampil(k){ const t = +store.get('hq_tutup_' + k) || 0; return Date.now() - t > 7 * 864e5; }
function tutup(id, k){ $(id).classList.remove('tampil'); store.set('hq_tutup_' + k, Date.now()); }
function tampil(id){ document.querySelectorAll('.bar.tampil').forEach(b => b.classList.remove('tampil')); setTimeout(() => $(id).classList.add('tampil'), 1500); }

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); promptPasang = e;
  if (bolehTampil('pasang')) tampil('barPasang');
});
async function pasang(){
  $('barPasang').classList.remove('tampil');
  if (!promptPasang) return;
  promptPasang.prompt(); await promptPasang.userChoice; promptPasang = null;
}
window.addEventListener('appinstalled', () => $('barPasang').classList.remove('tampil'));
if (isIos && !standalone && bolehTampil('ios')) tampil('barIos');

/* ---------- Notifikasi push ---------- */
function muatSkrip(src){ return new Promise((ok, gagal) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = gagal; document.head.appendChild(s); }); }
function siapkanNotif(){
  if (!pushSiap || !('Notification' in window)) return;
  if (Notification.permission === 'granted') return ambilTokenPush();
  // iPhone hanya bisa menerima push bila app sudah dipasang ke layar utama.
  if (Notification.permission === 'default' && (!isIos || standalone) && bolehTampil('notif')) tampil('barNotif');
}
async function aktifkanNotif(){
  $('barNotif').classList.remove('tampil');
  const izin = await Notification.requestPermission();
  if (izin === 'granted') ambilTokenPush();
}
async function ambilTokenPush(){
  try {
    if (!window.firebase) {
      await muatSkrip('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
      await muatSkrip('https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js');
    }
    if (!firebase.apps.length) firebase.initializeApp(C.firebaseConfig);
    const reg = swReg || await navigator.serviceWorker.ready;
    const m = firebase.messaging();
    const t = await m.getToken({ vapidKey: C.vapidKey, serviceWorkerRegistration: reg });
    if (t) { pushToken = t; store.set('hq_push', t); kirim({ hq: 'push', push: t }); }
    m.onMessage(p => {
      const d = p.data || {};
      reg.showNotification(d.title || "Halaqah Qur'an", { body: d.body || '', icon: 'icons/icon-192.png', badge: 'icons/badge-72.png' });
      kirim({ hq: 'notif' });
    });
  } catch (e) { console.warn('Notifikasi tidak aktif:', e); }
}

/* ---------- Status koneksi ---------- */
function cekKoneksi(){ $('offline').classList.toggle('tampil', !navigator.onLine); }
window.addEventListener('online', () => { cekKoneksi(); if (!termuat) location.reload(); });
window.addEventListener('offline', cekKoneksi);
cekKoneksi();
</script>
</body>
</html>
